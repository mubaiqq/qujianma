server {
    server_name pickup-next.mubaiyun.xyz;

    access_log /var/log/nginx/pickup_next_access.log pickup_safe;
    client_max_body_size 10m;

    location ^~ /.well-known/acme-challenge/ {
        root /home/ubuntu/qujianma-node/public;
        allow all;
        try_files $uri =404;
    }

    # 已由 Node 迁移并验证的公开入口继续直达 32200。
    location = /health/live { proxy_pass http://127.0.0.1:32200; include /etc/nginx/proxy_params; }
    location = /health/ready { proxy_pass http://127.0.0.1:32200; include /etc/nginx/proxy_params; }
    location = /api/version.php { proxy_pass http://127.0.0.1:32200; include /etc/nginx/proxy_params; }
    location = /android.php { proxy_pass http://127.0.0.1:32200; include /etc/nginx/proxy_params; }
    location = /manifest.webmanifest { proxy_pass http://127.0.0.1:32200; include /etc/nginx/proxy_params; }
    location = /service-worker.js { proxy_pass http://127.0.0.1:32200; include /etc/nginx/proxy_params; }
    location = /favicon.ico { proxy_pass http://127.0.0.1:32200; include /etc/nginx/proxy_params; }
    location ^~ /assets/ { proxy_pass http://127.0.0.1:32200; include /etc/nginx/proxy_params; }

    # 浏览器接入类路径继续由旧 PHP 处理；Node 的公开静态资源和已迁移接口
    # 通过更精确的 location 规则覆盖。必须显式列出，避免 /health 等 Node 运维路径
    # 意外落到旧 PHP。
    location = / { proxy_pass https://127.0.0.1; proxy_ssl_server_name on; proxy_ssl_name pickup.mubaiyun.xyz; proxy_ssl_verify off; proxy_set_header Host pickup.mubaiyun.xyz; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /index.php { proxy_pass https://127.0.0.1; proxy_ssl_server_name on; proxy_ssl_name pickup.mubaiyun.xyz; proxy_ssl_verify off; proxy_set_header Host pickup.mubaiyun.xyz; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /login.php { proxy_pass https://127.0.0.1; proxy_ssl_server_name on; proxy_ssl_name pickup.mubaiyun.xyz; proxy_ssl_verify off; proxy_set_header Host pickup.mubaiyun.xyz; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /guide.php { proxy_pass https://127.0.0.1; proxy_ssl_server_name on; proxy_ssl_name pickup.mubaiyun.xyz; proxy_ssl_verify off; proxy_set_header Host pickup.mubaiyun.xyz; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /share.php { proxy_pass https://127.0.0.1; proxy_ssl_server_name on; proxy_ssl_name pickup.mubaiyun.xyz; proxy_ssl_verify off; proxy_set_header Host pickup.mubaiyun.xyz; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location ^~ /admin/ { proxy_pass https://127.0.0.1; proxy_ssl_server_name on; proxy_ssl_name pickup.mubaiyun.xyz; proxy_ssl_verify off; proxy_set_header Host pickup.mubaiyun.xyz; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location ~ ^/api/[a-z_]+\.php$ { proxy_pass https://127.0.0.1; proxy_ssl_server_name on; proxy_ssl_name pickup.mubaiyun.xyz; proxy_ssl_verify off; proxy_set_header Host pickup.mubaiyun.xyz; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }

    # 未显式允许的路径由 Node 的统一 404 处理，不能成为旧站任意代理。
    location / {
        proxy_pass http://127.0.0.1:32200;
        include /etc/nginx/proxy_params;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pickup-next.mubaiyun.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pickup-next.mubaiyun.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = pickup-next.mubaiyun.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name pickup-next.mubaiyun.xyz;
    return 404; # managed by Certbot


}