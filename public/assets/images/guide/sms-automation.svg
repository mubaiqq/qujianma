<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-labelledby="t d"><title id="t">自动接收取件短信</title><desc id="d">短信通过快捷指令提交到取件助手</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.n{font-size:11px;font-weight:700;fill:#fff}.h{font-size:12px;font-weight:700;fill:#162033}.p{font-size:10px;fill:#667085}.line{stroke:#9abdec;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.icon{stroke:#1673e6;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><rect width="360" height="220" rx="18" fill="#f4f7fb"/><rect x="14" y="18" width="104" height="146" rx="14" fill="#fff" stroke="#dbe6f3"/><circle cx="31" cy="36" r="11" fill="#1673e6"/><text class="n" x="31" y="40" text-anchor="middle">1</text><text class="h" x="26" y="65">收到信息</text><text class="p" x="26" y="84">触发自动化</text><rect class="icon" x="48" y="105" width="38" height="30" rx="7"/><path class="icon" d="m53 112 14 11 14-11"/><path class="line" d="M119 92h20m-6-6 6 6-6 6"/><rect x="128" y="18" width="104" height="146" rx="14" fill="#fff" stroke="#dbe6f3"/><circle cx="145" cy="36" r="11" fill="#1673e6"/><text class="n" x="145" y="40" text-anchor="middle">2</text><text class="h" x="140" y="65">POST JSON</text><text class="p" x="140" y="84">发送 txt、phone</text><path class="icon" d="M167 111h30v27h-30zM174 119h16m-16 7h12"/><path class="line" d="M233 92h20m-6-6 6 6-6 6"/><rect x="242" y="18" width="104" height="146" rx="14" fill="#fff" stroke="#dbe6f3"/><circle cx="259" cy="36" r="11" fill="#1673e6"/><text class="n" x="259" y="40" text-anchor="middle">3</text><text class="h" x="254" y="65">自动识别</text><text class="p" x="254" y="84">生成取件码</text><circle cx="295" cy="122" r="20" fill="#e8f2ff"/><path class="icon" d="M286 122h18m-9-9v18"/><rect x="14" y="177" width="332" height="29" rx="10" fill="#e8f7ef"/><text x="180" y="196" text-anchor="middle" font-size="10" font-weight="650" fill="#218a57">专属 URL 含个人密钥，请勿公开分享</text></svg>