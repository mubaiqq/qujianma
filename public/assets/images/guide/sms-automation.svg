<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">自动接收取件短信</title><desc id="d">短信通过快捷指令和专属接口发送给取件助手的流程图</desc><rect width="960" height="540" rx="36" fill="#f2f5f9"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><text x="54" y="70" font-size="30" font-weight="700" fill="#162033">自动接收取件短信</text><text x="54" y="104" font-size="17" fill="#667085">“收到信息”自动化 → POST JSON → 自动识别</text><g fill="#fff" stroke="#d9e4f2" stroke-width="2"><rect x="48" y="165" width="190" height="220" rx="26"/><rect x="284" y="165" width="190" height="220" rx="26"/><rect x="520" y="165" width="190" height="220" rx="26"/><rect x="756" y="165" width="156" height="220" rx="26"/></g><g stroke="#1673e6" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="98" y="214" width="90" height="70" rx="18"/><path d="m107 226 36 28 36-28"/><path d="M345 217v74m-25-49 25-25 25 25m-50 25 25 25 25-25"/><path d="M564 218h102v95H564zM584 244h62M584 267h44M584 290h54"/><circle cx="834" cy="257" r="48"/><path d="M813 257h42m-21-21v42"/></g><g fill="#162033" font-size="19" font-weight="650" text-anchor="middle"><text x="143" y="325">收到信息</text><text x="379" y="325">快捷指令</text><text x="615" y="341">POST JSON</text><text x="834" y="341">取件助手</text></g><g fill="#667085" font-size="14" text-anchor="middle"><text x="143" y="352">取件短信触发</text><text x="379" y="352">无需确认自动运行</text><text x="615" y="368">txt + phone</text><text x="834" y="368">自动识别入库</text></g><g stroke="#8bb4ea" stroke-width="4" fill="none" stroke-linecap="round"><path d="M242 275h34m-10-10 10 10-10 10M478 275h34m-10-10 10 10-10 10M714 275h34m-10-10 10 10-10 10"/></g><rect x="215" y="426" width="530" height="62" rx="20" fill="#fff3d7"/><path d="M250 447v20m-10-10h20" stroke="#9a6a18" stroke-width="5" stroke-linecap="round"/><text x="280" y="453" font-size="16" font-weight="650" fill="#7b5717">专属 URL 含个人密钥</text><text x=