<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">手动添加与照片识别</title><desc id="d">首页加号菜单中的手动录入、照片识别和分享取件码</desc><rect width="960" height="540" rx="36" fill="#f2f5f9"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><text x="54" y="70" font-size="30" font-weight="700" fill="#162033">首页右上角的“+”能做什么？</text><text x="54" y="104" font-size="17" fill="#667085">根据内容选择入口，成功后自动保存</text><circle cx="480" cy="265" r="62" fill="#1673e6"/><path d="M452 265h56m-28-28v56" stroke="#fff" stroke-width="9" stroke-linecap="round"/><g fill="#fff" stroke="#d9e4f2" stroke-width="2"><rect x="62" y="164" width="260" height="235" rx="28"/><rect x="638" y="164" width="260" height="235" rx="28"/><rect x="350" y="365" width="260" height="130" rx="28"/></g><g stroke="#1673e6" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="112" y="205" width="80" height="96" rx="14"/><path d="M130 226h44M130 248h44M130 270h30"/><rect x="688" y="205" width="90" height="72" rx="14"/><circle cx="755" cy="228" r="8"/><path d="m700 266 23-24 16 16 13-13 18 21"/><path d="M780 309h48v-40m-24 20 24-20 20 20"/><path d="M419 418h42m38 0h42M459 402l40 32m0-32-40 32"/></g><g fill="#162033" font-size="21" font-weight="650"><text x="112" y="337">手动录入</text><text x="688" y="337">照片识别</text><text x="419" y="462">分享取件码</text></g><g fill="#667085" font-size="15"><text x="112" y="365">粘贴完整短信</text><text x="688" y="365">拍照或相册，最多 5 张</text><text x="419" y="486">24 小时有效，适合代取</text></g><g stroke="#8bb4ea" stroke-width="4" fill="none" stroke-dasharray="8 9"><path d="M420 246 326 246M540 246h94M480 330v31"/></g></g></svg>