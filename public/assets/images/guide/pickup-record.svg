<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">取件和记录</title><desc id="d">待取包裹完成后进入记录，并可恢复待取的流程</desc><rect width="960" height="540" rx="36" fill="#f2f5f9"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><text x="54" y="70" font-size="30" font-weight="700" fill="#162033">取到包裹后这样操作</text><text x="54" y="104" font-size="17" fill="#667085">按钮先显示成功，再移入取件记录</text><rect x="62" y="154" width="330" height="230" rx="28" fill="#fff" stroke="#d9e4f2" stroke-width="2"/><text x="94" y="194" font-size="16" fill="#667085">兔喜生活 · 1 件待取</text><text x="94" y="259" font-size="39" font-weight="750" fill="#162033">8-3-376</text><text x="94" y="294" font-size="15" fill="#7b8698">申通快递 · 今天 13:20</text><circle cx="338" cy="263" r="35" fill="#e8f2ff" stroke="#1673e6" stroke-width="3"/><path d="m322 263 11 11 22-25" stroke="#1673e6" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="568" y="154" width="330" height="230" rx="28" fill="#fff" stroke="#d9e4f2" stroke-width="2"/><text x="602" y="198" font-size="17" font-weight="650" fill="#162033">取件记录</text><rect x="602" y="224" width="262" height="92" rx="17" fill="#f0f3f7"/><text x="624" y="260" font-size="25" font-weight="700" fill="#687386">8-3-376</text><text x="624" y="289" font-size="14" fill="#7b8698">已取 · 兔喜生活</text><rect x="744" y="333" width="120" height="36" rx="12" fill="#e8f2ff"/><text x="804" y="356" font-size="14" font-weight="650" fill="#1673e6" text-anchor="middle">恢复待取</text><g stroke="#218a57" stroke-width="5" fill="none" stroke-linecap="round"><path d="M412 265h120m-18-18 18 18-18 18"/></g><text x="472" y="236" font-size="15" font-weight="650" fill="#218a57" text-anchor="middle">保存成功</text><rect x="178" y="426" width="604" height="62" rx="20" fill="#e8f7ef"/><path d="m218 455 10 10 22-25" stroke="#218a57" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="274" y="452" font-size="16" font-weight="650" fill="#1d7149">同一驿站有多件时，可点击“全部取出”</text><text x="274" y="476" font-size="14" fill="#3f7f62">误操作不用担心，在记录页面可以恢复</text></g></svg>