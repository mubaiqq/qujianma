<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="t d"><title id="t">消息通知设置</title><desc id="d">从主屏幕应用开启消息订阅并完成服务器推送测试的步骤</desc><rect width="960" height="540" rx="36" fill="#f2f5f9"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif"><text x="54" y="70" font-size="30" font-weight="700" fill="#162033">通知设置要完成整条链路</text><text x="54" y="104" font-size="17" fill="#667085">看到“服务器推送已发送”才算设置成功</text><g fill="#fff" stroke="#d9e4f2" stroke-width="2"><rect x="50" y="168" width="190" height="225" rx="26"/><rect x="274" y="168" width="190" height="225" rx="26"/><rect x="498" y="168" width="190" height="225" rx="26"/><rect x="722" y="168" width="190" height="225" rx="26"/></g><g stroke="#1673e6" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="110" y="207" width="70" height="70" rx="20"/><path d="M132 242h26m-13-13v26"/><path d="M335 223h68M335 249h52M335 275h62"/><path d="M558 276v-34a34 34 0 0 1 68 0v34m-80 0h92M584 296h16"/><rect x="776" y="214" width="82" height="94" rx="16"/><path d="M793 240h48M793 263h36M793 286h43"/></g><g fill="#162033" font-size="18" font-weight="650" text-anchor="middle"><text x="145" y="321">主屏幕打开</text><text x="369" y="321">消息订阅</text><text x="593" y="321">测试并允许</text><text x="817" y="321">系统通知</text></g><g fill="#667085" font-size="14" text-anchor="middle"><text x="145" y="349">不要从 Safari 标签页</text><text x="369" y="349">打开本设备开关</text><text x="593" y="349">服务器真实发送</text><text x="817" y="349">锁屏也能收到</text></g><g stroke="#8bb4ea" stroke-width="4" fill="none" stroke-linecap="round"><path d="M244 278h22m-10-10 10 10-10 10M468 278h22m-10-10 10 10-10 10M692 278h22m-10-10 10 10-10 10"/></g><rect x="162" y="430" width="636" height="58" rx="20" fill="#e8f7ef"/><circle cx="200" cy="459" r="17" fill="#218a57"/><path d="m192 459 6 6 11-13" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/><text x="232" y="454" font-size="16" font-weight="650" fill="#1d7149">服务器推送已发送</text><text x="232" y="477" font-size="14" fill="#3f7f62">此提示表示订阅已保存且推送服务实际投递成功</text></g></svg>