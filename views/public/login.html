<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>登录 · 取件助手</title><link rel="icon" href="/favicon.ico?v=20260724-icon-1" sizes="any"><link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon-v2.png?v=20260724-icon-2"><link rel="stylesheet" href="/assets/css/app.css?v=20260723-ios26-1"><link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.7.2/css/all.min.css"></head><body class="login-body"><main class="login-wrap"><div class="brand-mark"><i class="fa-solid fa-box"></i></div><h1>取件助手</h1><p id="authSubtitle">登录后查看你的取件码</p><div class="auth-tabs" role="tablist"><button type="button" class="auth-tab active" data-mode="login">登录</button><button type="button" class="auth-tab" data-mode="register">注册</button></div><form id="loginForm" class="login-form"><label for="username">用户名</label><div class="input-wrap"><i class="fa-regular fa-user"></i><input id="username" autocomplete="username" minlength="3" maxlength="30" required></div><label for="password">密码</label><div class="input-wrap"><i class="fa-solid fa-lock"></i><input id="password" type="password" autocomplete="current-password" minlength="8" maxlength="72" required><button type="button" class="icon-btn password-toggle" aria-label="显示密码"><i class="fa-regular fa-eye"></i></button></div><div id="confirmGroup" class="confirm-group hidden"><label for="confirmPassword">确认密码</label><div class="input-wrap"><i class="fa-solid fa-lock"></i><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="72"></div></div><div id="loginError" class="form-error" role="alert"></div><button id="loginButton" class="primary-button" type="submit"><span>登录</span></button></form></main><script src="/assets/js/login.js?v=20260723-3"></script></body></html>
