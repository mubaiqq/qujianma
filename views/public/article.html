<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2f5f9"><title>__ARTICLE_TITLE__ · 取件助手</title><link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css?v=6.7.2"><style>*{box-sizing:border-box}body{margin:0;background:#f2f5f9;color:#162033;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.article-page{width:min(100%,680px);min-height:100dvh;margin:auto;background:#fff}.article-header{position:sticky;z-index:5;top:0;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;min-height:64px;padding:max(10px,env(safe-area-inset-top)) 14px 10px;background:rgba(255,255,255,.96)}.article-home{display:grid;width:44px;height:44px;place-items:center;border-radius:50%;background:#edf2ff;color:#315bea;text-decoration:none}.article-header h1{overflow:hidden;margin:0;text-align:center;text-overflow:ellipsis;white-space:nowrap;font-size:17px}.article-content{padding:24px 20px 12px;font-size:16px;line-height:1.8;overflow-wrap:anywhere}.article-content img{max-width:100%;height:auto}.article-content a{color:#1673e6;text-decoration:underline;text-underline-offset:2px}.article-content h1,.article-content h2,.article-content h3,.article-content h4{margin:1.25em 0 .55em;line-height:1.35}.article-content p{margin:.8em 0}.article-content ul,.article-content ol{padding-left:1.5em}.article-content blockquote{margin:16px 0;padding:10px 14px;border-left:3px solid #315bea;background:#f2f5ff;color:#44516a}.article-content hr{margin:24px 0;border:0;border-top:1px solid #dfe5ee}.article-content table{display:block;width:100%;margin:16px 0;border-collapse:collapse;overflow-x:auto}.article-content th,.article-content td{min-width:100px;padding:9px 11px;border:1px solid #dfe5ee;text-align:left}.article-content th{background:#f4f6f9}.article-content .article-tab{display:inline-block;width:2em}.article-content pre{margin:16px 0;padding:14px;border-radius:12px;background:#172033;color:#f7f9fc;overflow-x:auto;white-space:pre-wrap}.article-content code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.article-content .article-copy{display:inline;color:#1673e6;font-weight:650;cursor:pointer;text-decoration:underline;text-decoration-style:dashed;text-underline-offset:3px;-webkit-tap-highlight-color:transparent}.article-content .article-copy:focus-visible{outline:2px solid #86a8ff;outline-offset:3px;border-radius:3px}.article-copy-toast{position:fixed;z-index:20;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:10px 16px;border-radius:11px;background:#172033;color:#fff;font-size:14px;white-space:nowrap}.article-copy-toast.success{background:#147a55}.article-copy-toast.error{background:#b42318}.article-copy-toast[hidden]{display:none}.article-meta{margin:22px 20px 0;padding:16px 0 calc(28px + env(safe-area-inset-bottom));border-top:1px solid #e8edf4;color:#7b8698;font-size:12px}</style></head><body><main class="article-page"><header class="article-header"><button id="articleHome" class="article-home" type="button" aria-label="返回上一页" onclick="if(history.length>1){history.back()}else{location.href='/'}"><i class="fa-solid fa-chevron-left"></i></button><h1>__ARTICLE_TITLE__</h1><span></span></header><article class="article-content">__ARTICLE_CONTENT__</article><footer class="article-meta">__ARTICLE_META__</footer><div class="article-copy-toast" id="articleCopyToast" role="status" aria-live="polite" hidden></div></main><script>(()=>{const toast=document.getElementById('articleCopyToast');let timer;const showCopyToast=(text,ok=true)=>{toast.textContent=text;toast.className='article-copy-toast '+(ok?'success':'error');toast.hidden=false;clearTimeout(timer);timer=setTimeout(()=>toast.hidden=true,1800)};const copyText=async copy=>{try{await navigator.clipboard.writeText(copy.textContent.trim());showCopyToast('复制成功')}catch{showCopyToast('复制失败',false)}};document.addEventListener('click',event=>{const copy=event.target.closest('.article-copy');if(copy)void copyText(copy)});document.addEventListener('keydown',event=>{const copy=event.target.closest('.article-copy');if(copy&&(event.key==='Enter'||event.key===' ')){event.preventDefault();void copyText(copy)}})})()</script></body></html>
