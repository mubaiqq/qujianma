<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2f5f9"><title>消息中心 · 取件助手</title><link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css?v=6.7.2"><style>*{box-sizing:border-box}body{margin:0;background:#f2f5f9;color:#162033;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.articles-page{width:min(100%,680px);min-height:100dvh;margin:auto}.articles-header{position:sticky;z-index:5;top:0;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;min-height:64px;padding:max(10px,env(safe-area-inset-top)) 14px 10px;background:rgba(242,245,249,.96)}.articles-back{display:grid;width:44px;height:44px;place-items:center;border-radius:50%;background:#fff;color:#162033;text-decoration:none}.articles-header h1{margin:0;text-align:center;font-size:17px}.article-list{display:grid;gap:10px;padding:12px 14px calc(24px + env(safe-area-inset-bottom))}.article-list-item{display:block;padding:17px;border-radius:18px;background:#fff;color:#162033;text-decoration:none}.article-list-item strong{display:block;font-size:16px}.article-list-item p{overflow:hidden;margin:8px 0;color:#566176;font-size:13px;line-height:1.55;text-overflow:ellipsis;white-space:nowrap}.article-list-item small{color:#7b8698;font-size:11px}.article-empty{padding:80px 20px;text-align:center;color:#7b8698}</style></head><body><main class="articles-page"><header class="articles-header"><button id="articlesBack" class="articles-back" type="button" aria-label="返回上一页" onclick="if(history.length>1){history.back()}else{location.href='/?tab=profile'}"><i class="fa-solid fa-chevron-left"></i></button><h1>消息中心</h1><span></span></header><section class="article-list">__ARTICLE_LIST__</section></main></body></html>
