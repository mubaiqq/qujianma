<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f2f5f9"><title>分享取件码 · 取件助手</title><link rel="icon" href="/favicon.ico?v=20260724-icon-1" sizes="any"><link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon-v2.png?v=20260724-icon-2"><link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css?v=6.7.2"><link rel="stylesheet" href="/assets/css/app.css?v=20260726-share-home-style-1"></head><body class="app-body share-body"><div class="app-shell"><header class="app-header"><div><div class="eyebrow">24小时分享链接</div><h1>取件助手</h1></div><div class="share-header-actions"><button type="button" id="copyAllCodes" class="share-copy-all hidden" aria-label="复制全部取件码"><i class="fa-regular fa-copy"></i><span>复制全部</span></button><div class="pending-total"><strong id="pendingCount">0</strong><span>待取</span></div></div></header><main class="app-main share-main"><div id="shareContent"><div class="loading-state"><i class="fa-solid fa-spinner fa-spin"></i>正在加载分享内容</div></div></main></div><div id="shareToast" class="toast" role="status" aria-live="polite"></div><script>window.__SHARE_TOKEN__=__SHARE_TOKEN__;const token=window.__SHARE_TOKEN__,content=document.getElementById('shareContent'),count=document.getElementById('pendingCount'),copy=document.getElementById('copyAllCodes'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),LOGOS={'德邦快递':'debang','德邦物流':'debang','京东快递':'jindong','京东物流':'jindong','极兔速递':'jt','极兔快递':'jt','J&T':'jt','顺丰速运':'sf','顺丰快递':'sf','申通快递':'st','圆通速递':'yt','圆通快递':'yt','韵达快递':'yunda','韵达速递':'yunda','中国邮政':'yz','邮政快递':'yz','EMS':'yz','中通快递':'zt','中通速递':'zt'};function toast(text){const el=document.getElementById('shareToast');el.textContent=text;el.classList.add('show');clearTimeout(el.t);el.t=setTimeout(()=>el.classList.remove('show'),2200)}function logo(name){const label=String(name||'').trim(),key=LOGOS[label]||Object.entries(LOGOS).find(([n])=>label.includes(n))?.[1];return key?'<span class="courier-logo" aria-hidden="true"><img src="/assets/images/couriers/'+key+'.webp" alt="" loading="lazy" decoding="async"></span>':'<span class="courier-logo courier-logo-fallback" aria-hidden="true"><i class="fa-solid fa-box"></i></span>'}function fmt(v){if(!v)return'';return String(v).slice(5,16).replace('-','/')}function empty(){copy.classList.add('hidden');content.innerHTML='<div class="empty-state"><i class="fa-regular fa-circle-check"></i>分享链接已失效或取件码已全部取出</div>'}function row(x){return '<div class="parcel-row" data-parcel="'+esc(x.id)+'" data-code="'+esc(x.pickup_code)+'">'+logo(x.courier_name)+'<div class="parcel-info"><div class="pickup-code">'+esc(x.pickup_code)+'</div><div class="parcel-meta">'+(x.received_at?'<span>'+esc(fmt(x.received_at))+'</span>':'')+(x.courier_name?'<span>'+esc(x.courier_name)+'</span>':'')+'</div></div><button class="check-button" aria-label="标记 '+esc(x.pickup_code)+' 已取"><i class="fa-solid fa-check"></i></button></div>'}function groups(items){const grouped=new Map;items.forEach(x=>{const id=String(x.station_id??x.station_name??'unknown');if(!grouped.has(id))grouped.set(id,{name:x.station_name||'未命名驿站',address:x.station_address||'',items:[]});grouped.get(id).items.push(x)});return [...grouped.values()].map(g=>'<section class="station-group"><header class="station-head"><div class="station-title"><strong>'+esc(g.name)+'</strong><span class="station-address" title="'+esc(g.address||'暂无地址')+'">'+esc(g.address||'暂无地址')+'</span></div><span class="station-count">'+g.items.length+' 件待取</span></header>'+g.items.map(row).join('')+'</section>').join('')}fetch('/api/public/share?t='+encodeURIComponent(token)).then(r=>r.ok?r.json():Promise.reject()).then(({data})=>{const items=data?.items||[];count.textContent=String(items.length);if(!items.length)return empty();copy.classList.remove('hidden');content.innerHTML='<div class="share-expire-note"><i class="fa-regular fa-clock"></i><span>有效期至 '+esc(data.expiresAt||data.expires_at||'')+'，取件后点击右侧圆形按钮标记已取。</span></div><div class="station-list">'+groups(items)+'</div>'}).catch(empty);content.addEventListener('click',e=>{const button=e.target.closest('.check-button');if(!button||button.disabled)return;const row=button.closest('[data-parcel]');button.disabled=true;button.classList.add('success');fetch('/api/public/share/picked',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({t:token,id:Number(row.dataset.parcel)})}).then(r=>{if(!r.ok)throw new Error();row.classList.add('parcel-confirmed');const group=row.closest('.station-group');row.remove();const left=group.querySelectorAll('[data-parcel]').length;if(!left)group.remove();else group.querySelector('.station-count').textContent=left+' 件待取';count.textContent=String(Math.max(0,Number(count.textContent)-1));if(Number(count.textContent)===0)empty()}).catch(()=>{button.disabled=false;button.classList.remove('success');toast('操作失败，请刷新后重试')})});copy.addEventListener('click',async()=>{const text=[...document.querySelectorAll('[data-code]')].map(x=>x.dataset.code).join('\n');try{await navigator.clipboard.writeText(text);copy.classList.add('success');copy.querySelector('span').textContent='已复制';setTimeout(()=>{copy.classList.remove('success');copy.querySelector('span').textContent='复制全部'},1400)}catch{toast('复制失败，请手动复制取件码')}});</script></body></html>
