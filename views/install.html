<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>取件助手安装</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#162033;background:#f2f5f9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(100%,520px);background:#fff;border-radius:24px;padding:28px;box-shadow:0 12px 45px #243b5b18}h1{margin:0 0 8px;font-size:25px}p{color:#68758a;line-height:1.6;font-size:14px}label{display:block;margin:15px 0 0;font-size:13px;font-weight:650}input{width:100%;height:46px;margin-top:7px;padding:0 12px;border:1px solid #dfe5ed;border-radius:12px;font-size:16px!important}button{width:100%;height:48px;margin-top:22px;border:0;border-radius:13px;background:#1673e6;color:#fff;font-size:15px;font-weight:700}button.success{background:#218a57}button.error{background:#c53f48}.hint{padding:11px 13px;border-radius:12px;background:#eef5ff;color:#43658f;font-size:13px}.error{color:#c53f48;background:#fff0f1}.success{color:#218a57;background:#edf9f1}.database-ready{display:flex;gap:10px;align-items:center;margin:18px 0 4px;padding:12px 13px;border-radius:12px;background:#edf9f1;color:#26764e;font-size:13px}.database-ready strong{display:block;color:#195c3b}.advanced{margin-top:20px;border-top:1px solid #edf0f4;padding-top:10px}summary{cursor:pointer;color:#566176;font-size:13px}
</style></head><body><main class="card"><h1>取件助手安装</h1><p>{{INTRODUCTION}}</p><div id="message" class="hint">安装完成后请使用管理员账号登录。</div><form id="form">{{DATABASE_FIELDS}}<label>管理员用户名<input name="username" value="admin" autocomplete="username" required minlength="3"></label><label>管理员密码<input name="password" type="password" autocomplete="new-password" required minlength="8"></label><label>确认管理员密码<input name="confirm_password" type="password" autocomplete="new-password" required minlength="8"></label><details class="advanced"><summary>高级设置</summary><label>访问地址（用于分享链接）<input name="app_base_url" placeholder="https://your-domain.example"></label></details><button id="submit" type="submit">开始安装</button></form></main><script>
const form=document.querySelector('#form'),msg=document.querySelector('#message'),btn=document.querySelector('#submit');form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.classList.remove('success','error');btn.textContent='正在安装…';msg.className='hint';msg.textContent='正在初始化数据库，请不要关闭页面…';try{const body=Object.fromEntries(new FormData(form));const r=await fetch('/install/api',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok||d.code!==0)throw new Error(d.message||'安装失败');msg.className='hint success';msg.textContent='安装成功，正在进入登录页面…';btn.classList.add('success');btn.textContent='✓ 安装成功';setTimeout(()=>location.href='/login',1200)}catch(err){msg.className='hint error';msg.textContent=err.message;btn.classList.add('error');btn.textContent='✗ 安装失败';setTimeout(()=>{btn.disabled=false;btn.classList.remove('error');btn.textContent='重新安装'},2000)}});
</script></body></html>
